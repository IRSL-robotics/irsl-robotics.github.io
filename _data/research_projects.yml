- id: cdm
  title: Contact Diffusion Model (CDM)
  subtitle: Generative Multi-Contact Point Localization
  area: physical-ai
  platform: Kinova Gen3 · joint torque sensors and a base F/T sensor
  tags:
    - Generative perception
    - Contact localization
  description: A diffusion model represents multiple contact locations consistent with proprioceptive measurements, using historical
    estimates and robot-surface geometry to localize single and dual contacts.
  highlights:
    - Represents ambiguous contact configurations as a distribution of possible locations.
    - Conditions on previous diffusion outputs to retain information about earlier contacts.
    - Transfers directly from simulation to single- and dual-contact experiments on a real robot.
  metrics:
    - value: 0.44 cm
      label: Single-contact localization M-RMSE
      comparison: 100 real-world trials
    - value: 1.24 cm
      label: Dual-contact localization M-RMSE
      comparison: 100 real-world trials
    - value: 15.97 ms
      label: Inference time
      comparison: Reported for the proposed Contact Diffusion Model
