- id: mcpep
  title: MCP-EP
  subtitle: Simultaneous Multi-Contact Localization and Force Identification
  area: physical-ai
  platform: Franka Emika Panda (simulation) · Kinova Gen3 (real-world demonstrations)
  tags:
    - Proprioceptive sensing
    - Particle filtering
  description: A multi-contact particle filter combines preprocessed robot meshes, exploration particles, and a base force/torque
    sensor to estimate contact locations and forces without tactile skin.
  highlights:
    - Estimates contact location and force from joint torque and base force/torque measurements.
    - Uses exploration particles to discover contacts on adjacent links.
    - Includes single-, dual-, and triple-contact simulation studies and supplementary real-robot demonstrations.
  metrics:
    - value: 2,200 Hz
      label: Single-contact update rate
      comparison: 0.45 ms in simulation on a 7-DoF robot
    - value: 99.96%
      label: Single-contact success rate
      comparison: 10,000 simulation trials; success threshold ≤ 2.25 cm
    - value: ≥ 3.5×
      label: Faster computation
      comparison: Compared with the methods evaluated in the paper
  published: true
  publication_sort: 20230529
